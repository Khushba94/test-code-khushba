<!DOCTYPE html>
<html lang="en-nz" dir="ltr">
<head>
   <meta charset="utf-8">
   <meta http-equiv="x-ua-compatible" content="ie=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="stylesheet" type="text/css" href="normalize.css">
   <link rel="stylesheet" type="text/css" href="styles.css">
   <link href="https://fonts.googleapis.com/css?family=Quicksand:500,700" rel="stylesheet">
   <title>Dog Sitter</title>
</head>
<body>
   <main>
      <!-- Hero Section -->
      <section class="hero-section">
         <div class="hero-content">
            <h1 class="hero-title">
                  Need a dog sitter?
            </h1>
            <p class="hero-description">
                  Find a trusted sitter in your community to look after your dog when you're busy or away.
            </p>
            <button class="hero-btn">
                  Learn More
            </button>
         </div>
      </section>
      <!-- Services Section -->
      <section class="services-section">
         <div class="services-header">
            <h2 class="services-title">
                  Our Services
            </h2>
            <p class="services-intro">
                  Local &amp; trusted pet sitters will treat your fur baby like family.
                  You'll have peace of mind with regular communication and premium insurance.
            </p>
         </div>
         
      </section> 
   </main>
</body>
</html>
